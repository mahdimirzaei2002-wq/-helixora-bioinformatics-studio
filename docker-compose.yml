services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
    expose:
      - "8501"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
